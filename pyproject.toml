[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docsage"
version = "0.1.0"
description = "Ask questions about your documents with retrieval-augmented generation and Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Damasio" }]
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0", "pypdf>=4.0", "mcp>=2.3"]

[project.scripts]
docsage = "docsage.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["docsage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
